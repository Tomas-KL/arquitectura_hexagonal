apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservas-app
  template:
    metadata:
      labels:
        app: reservas-app
    spec:
      containers:
        - name: app
          image: reservas_app:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
