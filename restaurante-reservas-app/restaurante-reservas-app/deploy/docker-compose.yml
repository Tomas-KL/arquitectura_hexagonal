version: '3.8'
services:
  app:
    build:
      context: ..
      dockerfile: ./deploy/Dockerfile
    container_name: reservas_app
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - mysql
    ports:
      - "3000:3000"
    volumes:
      - ..:/usr/src/app
    command: ["npm", "run", "start"]

  mysql:
    image: mysql:8.0
    container_name: reservas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: reservas_db
      MYSQL_USER: reservas_user
      MYSQL_PASSWORD: reservas_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: reservas_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
